# Entrenamiento y promoción. Deliberado, no reflejo.
#
# Separado de la inferencia a propósito: un fallo entrenando no puede bloquear
# una entrega. Lo dispara `evaluate.yml` cuando `retrain_decisions` dice
# `retrain` o cuando pasaron >= 110 min desde el último entrenamiento, o una
# mano humana. El cron de aquí abajo es sólo la red de seguridad: GitHub se
# salta schedules con carga, así que la cadencia real la lleva evaluate.yml.
#
# Dos jobs y dos ramas, y eso es el punto:
#
#   entrenar  -> hace checkout de `experimentos-ml`, donde vive el código de ML
#   promover  -> hace checkout de `main`, y carga el candidato con el MISMO
#                código que usa la inferencia en producción
#
# Verificar el artefacto con el cargador de la rama que lo entrenó probaría la
# cosa equivocada. El pickle viaja entre ramas; quien lo abre todos los días es
# `main`. Si no abre ahí, no sirve, por buenas que sean sus métricas.
name: pulso-transmi-train

on:
  workflow_dispatch:
  schedule:
    # Cada 2 h, aunque no haya drift. Con el escenario cambiando en horas, un
    # entrenamiento diario dejaba al champion días detrás del régimen vivo.
    # Correr no es promover: `ml.entrenar` sólo registra si una ruta lo permite
    # (historia, cambio de receta o refresco; ver sus compuertas).
    - cron: "15 */2 * * *"

concurrency:
  group: pulso-transmi-train
  cancel-in-progress: false   # nunca abortar un entrenamiento a medias

permissions:
  contents: read

jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      model_id: ${{ steps.entrenar.outputs.model_id }}
      version: ${{ steps.entrenar.outputs.version }}
      started_at: ${{ steps.abrir.outputs.started_at }}
      ml_commit: ${{ steps.commit.outputs.sha }}
    steps:
      # Primero que todo, antes de instalar nada: si algo de lo que sigue
      # falla, la corrida ya quedó constando en `training_runs`. El registro
      # es para verificar la cadencia, así que nunca bloquea el entrenamiento.
      - name: Registrar inicio en training_runs
        id: abrir
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          inicio=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "started_at=$inicio" >> "$GITHUB_OUTPUT"
          curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/rest/v1/training_runs?on_conflict=gh_run_id,attempt" \
            -H "apikey: $SUPABASE_SECRET_KEY" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"gh_run_id\": ${{ github.run_id }}, \"attempt\": ${{ github.run_attempt }},
                 \"event\": \"${{ github.event_name }}\", \"started_at\": \"$inicio\",
                 \"status\": \"running\",
                 \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            || { echo "::warning::no se pudo registrar el inicio en training_runs"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: experimentos-ml     # el trabajo de ML no vive en main

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Entrenar candidatos y comparar temporalmente
        id: entrenar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m ml.entrenar

  promover:
    needs: entrenar
    # Sin candidato no hay nada que promover, y eso es un final normal:
    # significa que ninguno le ganó al champion con margen suficiente.
    if: needs.entrenar.outputs.model_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4   # main: el código que corre en producción

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verificar con el código de producción y promover
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m pipeline.promover --model-id "${{ needs.entrenar.outputs.model_id }}"

  # Cierra la fila de `training_runs` pase lo que pase: sin candidato, con
  # candidato promovido, con la promoción rechazada o con el entrenamiento
  # caído. Sin este job, una corrida que falla quedaría en `running` y el
  # dashboard sólo podría adivinar.
  cerrar:
    needs: [entrenar, promover]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Registrar desenlace en training_runs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ENTRENAR: ${{ needs.entrenar.result }}
          PROMOVER: ${{ needs.promover.result }}
          CANDIDATO: ${{ needs.entrenar.outputs.model_id }}
          INICIO: ${{ needs.entrenar.outputs.started_at }}
          ML_COMMIT: ${{ needs.entrenar.outputs.ml_commit }}
        run: |
          set -euo pipefail
          if [ "$ENTRENAR" = cancelled ] || [ "$PROMOVER" = cancelled ]; then estado=cancelled
          elif [ "$ENTRENAR" != success ] || [ "$PROMOVER" = failure ]; then estado=failed
          else estado=success; fi

          # promoted: null sin candidato; si lo hubo, si `promover` lo activó.
          if [ -z "$CANDIDATO" ]; then candidato=null; promovido=null
          else candidato="\"$CANDIDATO\""
               [ "$PROMOVER" = success ] && promovido=true || promovido=false; fi
          [ -n "$ML_COMMIT" ] && commit="\"$ML_COMMIT\"" || commit=null

          echo "entrenar=$ENTRENAR promover=$PROMOVER -> $estado · candidato=$candidato promovido=$promovido"
          curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/rest/v1/training_runs?on_conflict=gh_run_id,attempt" \
            -H "apikey: $SUPABASE_SECRET_KEY" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"gh_run_id\": ${{ github.run_id }}, \"attempt\": ${{ github.run_attempt }},
                 \"event\": \"${{ github.event_name }}\",
                 \"started_at\": \"${INICIO:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}\",
                 \"finished_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
                 \"status\": \"$estado\", \"candidate_model_id\": $candidato,
                 \"promoted\": $promovido,
                 \"ml_commit\": $commit,
                 \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
