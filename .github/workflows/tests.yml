# Pruebas automatizadas: métrica, collector, contrato del batch, idempotencia,
# promoción/rollback, regla de reentrenamiento y ausencia de fuga temporal en
# las capas del champion. No tocan la API ni Supabase: corren sin secretos.
name: pulso-transmi-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
