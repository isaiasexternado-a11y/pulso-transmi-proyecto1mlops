# Vigilancia continua, entregas no multiplicadas.
#
# El problema que este workflow resuelve no es "cada cuánto mirar" sino que
# GitHub despierte. El cron de Actions se salta ejecuciones bajo carga: con
# `*/10` disparó una sola vez en nueve horas y se perdieron ~18 ciclos.
#
# Por eso el reloj no es el cron. Cada corrida es un TURNO: entra, vigila la
# API cada pocos minutos durante ~25, y encola su propio relevo. La cadena se
# sostiene sola. El cron queda como red de seguridad, para reenganchar si la
# cadena entera se rompe.
#
# Mirar muchas veces es gratis en intentos: antes de enviar, el programa
# consulta en Supabase si ese cycle_id ya tiene recibo *aceptado*. Está
# verificado en Actions: dos despertadas en la misma ventana dejaron
# `attempt=1`, no 2.
name: pulso-transmi-predict

on:
  schedule:
    - cron: "*/30 * * * *"   # sólo red de seguridad; la cadena manda
  workflow_dispatch:          # el relevo y las pruebas manuales entran por aquí

concurrency:
  group: pulso-transmi-predict
  cancel-in-progress: false   # nunca abortar una entrega a medio camino

permissions:
  contents: read
  actions: write              # para encolar el relevo y avisar al evaluador

env:
  TURNO_MIN: 50               # turnos largos: cada relevo es una ocasión de romperse
  INTERVALO_SEG: 150          # cada cuánto se consulta el ciclo

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 65       # holgura sobre TURNO_MIN, nunca al filo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # El relevo se encola AL PRINCIPIO, no al final: si este turno se cae a
      # la mitad —runner muerto, timeout, lo que sea— el sucesor ya está en la
      # cola y arranca solo.
      #
      # Se encola SIN CONDICIONES, y eso es deliberado. Antes había un guardia
      # que sólo encolaba "si no hay otra corrida viva", para evitar que las
      # cadenas se multiplicaran. Dos problemas: GitHub ya impide la
      # multiplicación por su cuenta —"any existing pending job or workflow in
      # the same concurrency group will be canceled and the new queued job will
      # take its place"—, y el guardia creaba un bloqueo mutuo. Dos turnos
      # solapados se veían el uno al otro, ninguno encolaba, y al terminar
      # ambos la cadena moría en silencio. Pasó el 2026-09-23 a las 14:21 y
      # costó dos ciclos.
      - name: Encolar el relevo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run predict.yml --ref "${{ github.ref_name }}"

      - name: Turno de vigilancia
        env:
          PULSO_API_BASE: ${{ vars.PULSO_API_BASE }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          fin=$(( $(date +%s) + TURNO_MIN * 60 ))
          intentos=0; malos=0
          while [ "$(date +%s)" -lt "$fin" ]; do
            intentos=$((intentos + 1))
            if ! python -m pipeline.entregar; then
              malos=$((malos + 1))
              echo "::warning::intento $intentos falló"
            fi
            restante=$(( fin - $(date +%s) ))
            [ "$restante" -le 0 ] && break
            espera=$INTERVALO_SEG
            [ "$restante" -lt "$espera" ] && espera=$restante
            sleep "$espera"
          done
          echo "turno cerrado: $intentos intentos, $malos fallidos"
          # Un fallo suelto es normal: el corte del ciclo puede no haber llegado
          # todavía al histórico y la vuelta siguiente lo resuelve. Que fallen
          # TODOS es otra cosa —credencial vencida, artefacto roto, API caída— y
          # eso sí tiene que pintar el turno de rojo.
          if [ "$intentos" -gt 0 ] && [ "$malos" -eq "$intentos" ]; then
            echo "::error::ningún intento del turno prosperó"
            exit 1
          fi

      # Segunda oportunidad. Si el relevo que se encoló al empezar fue
      # cancelado —GitHub cancela el pendiente cuando llega uno más nuevo— y
      # su reemplazo no sobrevivió, esto lo vuelve a crear. Encolar de más es
      # inofensivo: el grupo de concurrencia deja uno solo.
      - name: Confirmar el relevo al cerrar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run predict.yml --ref "${{ github.ref_name }}" || true

      # La evaluación es una rutina aparte, como pide la guía, pero no depende
      # del cron: se la avisa desde aquí para que herede esta misma cadena.
      - name: Avisar al evaluador
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run evaluate.yml --ref "${{ github.ref_name }}" || true
